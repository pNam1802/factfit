# Database migrations. The app applies them itself (factfit.db.init_db); this file is for
# writing new ones:  uv run alembic revision --autogenerate -m "add x to y"
[alembic]
script_location = factfit/db/migrations
sqlalchemy.url = sqlite:///data/factfit.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
