[project]
name = "factfit"
version = "0.1.0"
description = "LangGraph agent that tailors LaTeX CVs to job descriptions, with every bullet traced to a verified profile."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nguyễn Phương Nam" }]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai>=3.22.1",
    "pdfminer-six>=20260107",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.47",
    "uvicorn>=0.54.0",
]

[project.scripts]
factfit = "factfit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
