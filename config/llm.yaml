# Which model each agent node uses, and what models cost.
# Change models here, never in code. Check that a model works with: uv run factfit llm-check

# openai or deepseek; the API key comes from OPENAI_API_KEY or DEEPSEEK_API_KEY in .env.
# Switched to DeepSeek on 2026-10-12 (OpenAI credit ran out). Efforts and prompts below were
# chosen by evals on gpt-5 / gpt-5-mini: re-run the evals before trusting them on DeepSeek.
provider: deepseek

models:
  small: deepseek-flash # cheap and fast: parsing, matching, judging
  large: deepseek-v4-pro # better writing: rewriting bullets
  # OpenAI defaults until 2026-10-12: small gpt-5-mini, large gpt-5

nodes:
  parse_jd: { model: small, prompt: v2, reasoning_effort: low } # chosen by eval-parse, 2026-10-02
  match: { model: small, prompt: v1, reasoning_effort: low }
  rewrite: { model: large, prompt: v1, reasoning_effort: low } # effort not yet chosen by eval
  judge: { model: small, prompt: v2, reasoning_effort: minimal } # chosen by eval-grounding, 2026-10-13 (deepseek-flash)
  llm_check: { model: small, reasoning_effort: minimal }
  eval_align: { model: small, prompt: v1, reasoning_effort: low } # judge for factfit eval-parse
  gen_cases: { model: small, prompt: v1, reasoning_effort: low } # writes grounding test cases
  # Optional per-node settings passed to the API, e.g.:
  # rewrite: { model: large, reasoning_effort: medium }

# USD per 1 million tokens. Copy the numbers from the provider's pricing page (for OpenAI,
# https://openai.com/api/pricing)
# and keep them up to date. A model missing here still works; its calls are
# logged with cost_usd = null and `factfit llm-check` reminds you to add it.
#
# Standard (non-batch, non-cached) rates, collected 2026-10-01 from public price
# trackers because openai.com/api/pricing blocks automated reads. Verify there.
# Newer models are listed so they can be compared later (PRD §10.1); defaults stay on
# gpt-5 / gpt-5-mini to keep a tailoring run under the $0.05 cost target.
pricing:
  # DeepSeek, from https://api-docs.deepseek.com/quick_start/pricing on 2026-10-12.
  # Peak-hour, cache-miss rates (off-peak is half, cache hits much cheaper), so logged costs
  # are an upper bound.
  deepseek-flash: { input: 0.30, output: 1.20 }
  deepseek-v4-pro: { input: 1.32, output: 3.96 }
  gpt-5-mini: { input: 0.25, output: 2.00 }
  gpt-5: { input: 1.25, output: 10.00 }
  gpt-5.4-mini: { input: 0.75, output: 4.50 }
  gpt-5.5: { input: 5.00, output: 30.00 }

max_retries: 2 # extra attempts after the first one fails
timeout_s: 60
