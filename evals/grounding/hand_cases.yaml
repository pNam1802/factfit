# Hand-written grounding cases (2026-10-05), kept apart from cases.jsonl so rebuilding the
# generated set never overwrites them. Written to cover what the generated set lacks:
#
# subtle_claim (fabricated): one unsupported claim woven INTO the sentence, words only (no
#   new digits, technologies or role verbs), the way a real rewrite slips: an inferred
#   quality ("real-time" from 25 fps), an extra task, a purpose or a result.
# hard_paraphrase (grounded): faithful rewrites with heavier restructuring than the generated
#   paraphrases, to see whether a checker flags rewording as fabrication.
#
# Written by Claude; the claim each subtle case adds is in `adds`. Review before trusting.

