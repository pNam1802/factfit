# Technology names and the spellings that mean EXACTLY the same thing (PRD §8.2).
# Used by the grounding check: a technology in a rewritten bullet must also be in its source
# bullet, after mapping every spelling to the name on the left.
#
# Rules for editing:
# - Only true equivalents. Never map a specific thing to a broader one ("YOLOv8" is not
#   "object detection", "LangGraph" is not "LangChain"): that would let a rewrite claim
#   something the source does not say.
# - Avoid short aliases that are common words ("go", "tf", "ts", "r").
# - Matching ignores case and needs word boundaries: "SQL" does not match inside "PostgreSQL".
# - When the LLM judge reports a technology that is missing here, add it.

